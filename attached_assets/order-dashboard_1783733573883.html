<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الطلبات — روابي المندي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14161B;
    --surface: #1B1E25;
    --surface-2: #22252E;
    --line: #2B2F39;
    --text: #EDEEF2;
    --text-dim: #9297A6;
    --text-faint: #5C6170;
    --saffron: #F2994A;
    --saffron-dim: rgba(242,153,74,.14);
    --ready: #3DD68C;
    --ready-dim: rgba(61,214,140,.14);
    --delivering: #4FA3F7;
    --delivering-dim: rgba(79,163,247,.14);
    --cancelled: #EF5A5A;
    --cancelled-dim: rgba(239,90,90,.14);
    --new: #C7A6FF;
    --new-dim: rgba(199,166,255,.14);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    min-height: 100vh;
  }
  .display{ font-family:'Cairo', sans-serif; }

  /* ===== Top App Bar ===== */
  .appbar{
    position: sticky; top:0; z-index: 30;
    background: linear-gradient(180deg, var(--bg) 85%, rgba(20,22,27,0));
    padding: 18px 20px 10px;
  }
  .appbar-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 4px;}
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{
    width:34px; height:34px; border-radius:10px;
    background: linear-gradient(135deg, var(--saffron), #C9761E);
    display:flex; align-items:center; justify-content:center;
    font-family:'Cairo'; font-weight:800; color:#1B1206; font-size:15px;
  }
  .brand-name{ font-family:'Cairo'; font-weight:700; font-size: 15.5px; letter-spacing:.2px; }
  .brand-sub{ font-size:11.5px; color:var(--text-faint); margin-top:1px; }
  .live-dot{ width:6px; height:6px; border-radius:50%; background:var(--ready); display:inline-block; margin-left:5px; box-shadow:0 0 0 3px var(--ready-dim); }

  .refresh-btn{
    width:36px; height:36px; border-radius:10px; border:1px solid var(--line);
    background: var(--surface); color:var(--text-dim); display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:.15s;
  }
  .refresh-btn:hover{ color:var(--text); border-color:#3A3F4C; }

  h1.title{ font-size:24px; margin: 10px 0 14px; }

  /* ===== Search ===== */
  .search-wrap{ position:relative; margin-bottom: 12px; }
  .search-wrap svg{ position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--text-faint); }
  .search-input{
    width:100%; background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:12px 40px 12px 14px; color:var(--text); font-family:inherit; font-size:14px;
    outline:none; transition:.15s;
  }
  .search-input::placeholder{ color:var(--text-faint); }
  .search-input:focus{ border-color: var(--saffron); background: var(--surface-2); }

  /* ===== Tabs ===== */
  .tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex:0 0 auto; display:flex; align-items:center; gap:6px;
    padding:8px 14px; border-radius:10px; font-size:13px; font-weight:500;
    background:var(--surface); border:1px solid var(--line); color:var(--text-dim);
    cursor:pointer; white-space:nowrap; transition:.15s;
  }
  .tab .n{ font-size:11px; font-weight:700; padding:1px 6px; border-radius:20px; background:#2C303B; color:var(--text-dim); }
  .tab.active{ background: var(--saffron-dim); border-color: rgba(242,153,74,.4); color:#FFC98F; }
  .tab.active .n{ background: var(--saffron); color:#1B1206; }

  /* ===== Sort + select row ===== */
  .util-row{ display:flex; align-items:center; justify-content:space-between; margin: 2px 0 4px; }
  .sort-btn{
    display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line);
    color:var(--text-dim); font-family:inherit; font-size:12.5px; padding:7px 12px; border-radius:9px; cursor:pointer;
  }
  .sort-btn:hover{ color:var(--text); border-color:#3A3F4C; }
  .select-toggle{ display:flex; align-items:center; gap:6px; color:var(--text-faint); font-size:12.5px; cursor:pointer; user-select:none; }
  .select-toggle.on{ color: var(--saffron); }

  .checkbox{
    width:18px; height:18px; border-radius:6px; border:1.5px solid var(--line); background:var(--surface);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer; transition:.15s;
  }
  .checkbox.checked{ background: var(--saffron); border-color: var(--saffron); }
  .checkbox svg{ opacity:0; transition:.1s; }
  .checkbox.checked svg{ opacity:1; }

  /* bulk action bar */
  .bulk-bar{
    position: fixed; bottom:16px; left:16px; right:16px; z-index:40;
    background: var(--surface-2); border:1px solid var(--line); border-radius:14px;
    padding:10px 14px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 12px 30px rgba(0,0,0,.4);
    transform: translateY(140%); transition: transform .25s ease;
  }
  .bulk-bar.show{ transform: translateY(0); }
  .bulk-count{ font-size:13px; font-weight:600; }
  .bulk-count span{ color: var(--saffron); font-family:'Cairo'; font-weight:700; }
  .bulk-actions{ display:flex; gap:8px; }
  .bulk-btn{
    display:flex; align-items:center; gap:6px; background:var(--saffron-dim); border:1px solid rgba(242,153,74,.35);
    color:#FFC98F; font-family:inherit; font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:9px; cursor:pointer;
  }
  .bulk-btn.clear{ background:transparent; border-color:var(--line); color:var(--text-dim); }

  .driver-chip{
    display:flex; align-items:center; gap:6px; background:var(--delivering-dim); color:#A6CDFB;
    font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:8px; margin-top:8px;
  }

  /* ===== Section nav (Receive / Deliver / Drivers) ===== */
  .section-nav{ display:flex; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:4px; margin: 14px 0 16px; }
  .section-nav button{
    flex:1; background:transparent; border:none; color:var(--text-dim); font-family:inherit;
    padding:9px 6px; border-radius:9px; font-size:12.5px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .section-nav button.active{ background:var(--surface-2); color:var(--text); box-shadow: inset 0 0 0 1px var(--line); }

  /* ===== List ===== */
  .list{ padding: 0 16px 100px; display:flex; flex-direction:column; gap:10px; }

  .order-card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color .15s;
  }
  .order-card[data-status="processing"]{ border-inline-start: 3px solid var(--saffron); }
  .order-card[data-status="ready"]{ border-inline-start: 3px solid var(--ready); }
  .order-card[data-status="delivering"]{ border-inline-start: 3px solid var(--delivering); }
  .order-card[data-status="new"]{ border-inline-start: 3px solid var(--new); }
  .order-card[data-status="cancelled"]{ border-inline-start: 3px solid var(--cancelled); opacity:.6; }

  .card-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 12px 14px; cursor:pointer; gap:10px;
  }
  .head-main{ display:flex; align-items:center; gap:10px; min-width:0; }
  .order-id{ font-family:'Cairo'; font-weight:700; font-size:13px; color:var(--text-faint); flex-shrink:0; }
  .customer{ display:flex; flex-direction:column; min-width:0; }
  .customer-name{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .customer-meta{ font-size:11.5px; color:var(--text-faint); margin-top:1px; }

  .head-side{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .amount{ font-family:'Cairo'; font-weight:700; font-size:15px; }
  .amount span{ font-size:11px; color:var(--text-faint); font-weight:500; margin-right:2px; }

  .status-pill{
    font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:8px; white-space:nowrap;
    display:flex; align-items:center; gap:5px;
  }
  .status-pill::before{ content:''; width:6px; height:6px; border-radius:50%; }
  .status-processing{ background:var(--saffron-dim); color:#FFC98F; }
  .status-processing::before{ background:var(--saffron); }
  .status-ready{ background:var(--ready-dim); color:#8DF0BE; }
  .status-ready::before{ background:var(--ready); }
  .status-delivering{ background:var(--delivering-dim); color:#A6CDFB; }
  .status-delivering::before{ background:var(--delivering); }
  .status-new{ background:var(--new-dim); color:#E0CDFF; }
  .status-new::before{ background:var(--new); }
  .status-cancelled{ background:var(--cancelled-dim); color:#F7A9A9; }
  .status-cancelled::before{ background:var(--cancelled); }

  .chevron{ color:var(--text-faint); transition:transform .2s; flex-shrink:0; }
  .order-card.open .chevron{ transform:rotate(180deg); }

  /* ===== Expandable body ===== */
  .card-body{ max-height:0; overflow:hidden; transition:max-height .25s ease; }
  .order-card.open .card-body{ max-height:600px; }
  .body-inner{ padding: 0 14px 14px; }

  .divider{ height:1px; background:var(--line); margin:0 0 12px; }

  .info-row{ display:flex; align-items:center; justify-content:space-between; font-size:13px; color:var(--text-dim); padding:6px 0; }
  .info-row .label{ display:flex; align-items:center; gap:6px; color:var(--text-faint); }

  .items-box{ background:var(--surface-2); border-radius:10px; padding:10px 12px; margin:8px 0 12px; }
  .item-row{ display:flex; justify-content:space-between; font-size:13px; padding:3px 0; }
  .item-row .qty{ color:var(--text-faint); }

  /* progress rail — signature element */
  .rail{ display:flex; align-items:center; margin: 4px 0 14px; padding: 0 2px; }
  .rail-step{ flex:1; display:flex; flex-direction:column; align-items:center; position:relative; }
  .rail-line{ position:absolute; top:7px; right:50%; width:100%; height:2px; background:var(--line); z-index:0; }
  .rail-step:first-child .rail-line{ display:none; }
  .rail-dot{ width:16px; height:16px; border-radius:50%; background:var(--line); border:2px solid var(--surface); z-index:1; display:flex; align-items:center; justify-content:center; }
  .rail-step.done .rail-dot{ background: var(--saffron); }
  .rail-step.done .rail-line{ background: var(--saffron); }
  .rail-step.current .rail-dot{ background: var(--saffron); box-shadow: 0 0 0 4px var(--saffron-dim); }
  .rail-label{ font-size:10px; color:var(--text-faint); margin-top:6px; text-align:center; }
  .rail-step.done .rail-label, .rail-step.current .rail-label{ color:var(--text-dim); }

  /* action icon row */
  .actions{ display:flex; gap:8px; }
  .action-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--surface-2); border:1px solid var(--line); color:var(--text-dim);
    border-radius:10px; padding:10px; font-size:12.5px; font-family:inherit; font-weight:500;
    cursor:pointer; transition:.15s;
  }
  .action-btn:hover{ background:#2A2E38; color:var(--text); }
  .action-btn.primary{ background: var(--saffron-dim); border-color:rgba(242,153,74,.35); color:#FFC98F; }
  .action-btn.primary:hover{ background: rgba(242,153,74,.22); }
  .action-btn.danger{ color:#F7A9A9; }
  .action-btn.danger:hover{ background: var(--cancelled-dim); border-color:rgba(239,90,90,.35); }

  /* toast */
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(120%);
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:12px 20px; border-radius:12px; font-size:13px; display:flex; align-items:center; gap:8px;
    box-shadow:0 10px 30px rgba(0,0,0,.4); transition:transform .3s ease; z-index:100;
  }
  .toast.show{ transform:translateX(-50%) translateY(0); }
  .toast .dot{ width:7px; height:7px; border-radius:50%; background:var(--ready); }

  .empty{ text-align:center; padding:60px 20px; color:var(--text-faint); }
  .empty svg{ margin-bottom:12px; opacity:.4; }
</style>
</head>
<body>

<div class="appbar">
  <div class="appbar-row">
    <div class="brand">
      <div class="mark">ر</div>
      <div>
        <div class="brand-name">روابي المندي</div>
        <div class="brand-sub"><span class="live-dot"></span>تحديث تلقائي كل 10 ثوان</div>
      </div>
    </div>
    <div class="refresh-btn" onclick="refreshData()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>
    </div>
  </div>

  <h1 class="title display">إدارة الطلبات</h1>

  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input class="search-input" placeholder="ابحث برقم الطلب أو رقم الجوال" oninput="filterSearch(this.value)">
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-filter="all" onclick="setFilter(this,'all')">الكل <span class="n">6</span></div>
    <div class="tab" data-filter="new" onclick="setFilter(this,'new')">جديد <span class="n">1</span></div>
    <div class="tab" data-filter="processing" onclick="setFilter(this,'processing')">جاري التجهيز <span class="n">3</span></div>
    <div class="tab" data-filter="ready" onclick="setFilter(this,'ready')">جاهز للتسليم <span class="n">0</span></div>
    <div class="tab" data-filter="delivering" onclick="setFilter(this,'delivering')">قيد التوصيل <span class="n">28</span></div>
    <div class="tab" data-filter="cancelled" onclick="setFilter(this,'cancelled')">ملغى <span class="n">68</span></div>
  </div>

  <div class="util-row">
    <div class="sort-btn" onclick="toggleSort()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5h10M11 9h7M11 13h4"/><path d="m3 8 3-3 3 3M6 5v14"/></svg>
      <span id="sort-label">الأحدث أولاً</span>
    </div>
    <div class="select-toggle" id="select-toggle" onclick="toggleSelectMode()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>تحديد للطباعة</span>
    </div>
  </div>

  <div class="section-nav">
    <button class="active">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
      استقبال الطلبات
    </button>
    <button>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/></svg>
      تسليم الفرع
    </button>
    <button>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>
      المناديب
    </button>
  </div>
</div>

<div class="list" id="list"></div>

<div class="bulk-bar" id="bulk-bar">
  <div class="bulk-count">تم تحديد <span id="bulk-num">0</span> طلب</div>
  <div class="bulk-actions">
    <div class="bulk-btn clear" onclick="clearSelection()">إلغاء</div>
    <div class="bulk-btn" onclick="printSelected()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"/><rect x="6" y="14" width="12" height="8"/></svg>
      طباعة المحدد
    </div>
  </div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toast-text">تم تحديث الحالة</span></div>

<script>
const orders = [
  { id:5, name:'محمد العتيبي', phone:'0501234567', items:[{name:'مندي دجاج وسط', qty:2}], amount:75, pay:'شبكة', status:'delivering', time:'٤:٣٠ م', driver:'سعيد الحربي', ts: Date.now() - 2*60000 },
  { id:4, name:'اختبار الإصلاح', phone:'0500000999', items:[{name:'صنف اختبار', qty:1}], amount:20, pay:'نقدي', status:'processing', time:'٤:١٩ م', ts: Date.now() - 12*60000 },
  { id:3, name:'اختبار الرسائل الخاصة', phone:'0500000003', items:[{name:'صنف تجريبي', qty:1}], amount:20, pay:'نقدي', status:'processing', time:'٦:٢٣ م', ts: Date.now() - 35*60000 },
  { id:2, name:'اختبار الإشعار 2', phone:'0500000002', items:[{name:'صنف تجريبي', qty:1}], amount:20, pay:'نقدي', status:'processing', time:'٥:٠٤ م', ts: Date.now() - 50*60000 },
  { id:1, name:'اختبار الإشعار', phone:'0500000001', items:[{name:'صنف تجريبي', qty:1}], amount:20, pay:'نقدي', status:'new', time:'٥:٠٣ م', ts: Date.now() - 1*60000 },
  { id:0, name:'اختبار ملغى', phone:'0500000000', items:[{name:'صنف تجريبي', qty:1}], amount:20, pay:'نقدي', status:'cancelled', time:'٤:٥٠ م', ts: Date.now() - 90*60000 },
];

const statusMeta = {
  new:{ label:'جديد', class:'status-new' },
  processing:{ label:'جاري التجهيز', class:'status-processing' },
  ready:{ label:'جاهز للتسليم', class:'status-ready' },
  delivering:{ label:'قيد التوصيل', class:'status-delivering' },
  cancelled:{ label:'ملغى', class:'status-cancelled' },
};

const railSteps = [
  { key:'new', label:'جديد' },
  { key:'processing', label:'التجهيز' },
  { key:'ready', label:'جاهز' },
  { key:'delivering', label:'التوصيل' },
  { key:'delivered', label:'تم التسليم' },
];

let currentFilter = 'all';
let searchTerm = '';
let sortNewestFirst = true;
let selectMode = false;
let selectedIds = new Set();

function renderRail(status){
  if(status === 'cancelled'){
    return `<div style="font-size:12px;color:var(--text-faint);text-align:center;padding:8px 0 14px;">تم إلغاء هذا الطلب</div>`;
  }
  const order = ['new','processing','ready','delivering','delivered'];
  const idx = order.indexOf(status);
  return `<div class="rail">` + railSteps.map((s,i)=>{
    let cls = '';
    if(i < idx) cls = 'done';
    else if(i === idx) cls = 'current';
    return `<div class="rail-step ${cls}"><div class="rail-line"></div><div class="rail-dot"></div><div class="rail-label">${s.label}</div></div>`;
  }).join('') + `</div>`;
}

function renderCard(o){
  const meta = statusMeta[o.status];
  const itemsHtml = o.items.map(it => `<div class="item-row"><span>${it.name}</span><span class="qty">× ${it.qty}</span></div>`).join('');
  const checked = selectedIds.has(o.id);
  const checkboxHtml = selectMode ? `
    <div class="checkbox ${checked ? 'checked' : ''}" onclick="event.stopPropagation(); toggleSelect(${o.id})">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#1B1206" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>
    </div>` : '';
  const driverHtml = o.status === 'delivering' && o.driver ? `
    <div class="driver-chip">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
      المندوب: ${o.driver}
    </div>` : '';
  return `
  <div class="order-card" data-status="${o.status}" data-id="${o.id}" data-search="${o.name} ${o.phone} ${o.id}">
    <div class="card-head" onclick="${selectMode ? `toggleSelect(${o.id})` : `toggleCard(${o.id})`}">
      <div class="head-main">
        ${checkboxHtml}
        <span class="order-id">#${o.id}</span>
        <div class="customer">
          <span class="customer-name">${o.name}</span>
          <span class="customer-meta">${o.phone} · ${o.time}</span>
        </div>
      </div>
      <div class="head-side">
        <div class="amount">${o.amount}<span>ر.س</span></div>
        <div class="status-pill ${meta.class}">${meta.label}</div>
        ${!selectMode ? `<svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>` : ''}
      </div>
    </div>
    <div class="card-body">
      <div class="body-inner">
        <div class="divider"></div>
        ${renderRail(o.status)}
        <div class="items-box">${itemsHtml}</div>
        <div class="info-row"><span class="label">طريقة الدفع</span><span>${o.pay}</span></div>
        <div class="info-row"><span class="label">رقم الجوال</span><span>${o.phone}</span></div>
        ${driverHtml}
        <div class="actions" style="margin-top:10px;">
          <div class="action-btn primary" onclick="event.stopPropagation(); toast('تم فتح محادثة واتساب')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            مراسلة
          </div>
          <div class="action-btn" onclick="event.stopPropagation(); toast('جارِ طباعة الإيصال')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            طباعة
          </div>
          ${o.status !== 'cancelled' ? `
          <div class="action-btn danger" onclick="event.stopPropagation(); cancelOrder(${o.id})">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
            إلغاء
          </div>` : ''}
        </div>
      </div>
    </div>
  </div>`;
}

function renderList(){
  const list = document.getElementById('list');
  let filtered = orders.filter(o => currentFilter === 'all' || o.status === currentFilter);
  if(searchTerm.trim()){
    const t = searchTerm.trim();
    filtered = filtered.filter(o => (o.name + ' ' + o.phone + ' ' + o.id).includes(t));
  }
  filtered = filtered.slice().sort((a,b) => sortNewestFirst ? b.ts - a.ts : a.ts - b.ts);
  if(filtered.length === 0){
    list.innerHTML = `<div class="empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <div>لا توجد طلبات مطابقة</div>
    </div>`;
    return;
  }
  list.innerHTML = filtered.map(renderCard).join('');
}

function toggleCard(id){
  const card = document.querySelector(`.order-card[data-id="${id}"]`);
  card.classList.toggle('open');
}

function setFilter(el, filter){
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentFilter = filter;
  renderList();
}

function filterSearch(v){
  searchTerm = v;
  renderList();
}

function toast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toast-text').textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

function cancelOrder(id){
  const o = orders.find(x => x.id === id);
  if(o){ o.status = 'cancelled'; renderList(); toast('تم إلغاء الطلب #' + id); }
}

function refreshData(){
  toast('تم تحديث القائمة');
}

function toggleSort(){
  sortNewestFirst = !sortNewestFirst;
  document.getElementById('sort-label').textContent = sortNewestFirst ? 'الأحدث أولاً' : 'الأقدم أولاً';
  renderList();
}

function toggleSelectMode(){
  selectMode = !selectMode;
  const el = document.getElementById('select-toggle');
  el.classList.toggle('on', selectMode);
  if(!selectMode){ selectedIds.clear(); updateBulkBar(); }
  renderList();
}

function toggleSelect(id){
  if(selectedIds.has(id)) selectedIds.delete(id);
  else selectedIds.add(id);
  renderList();
  updateBulkBar();
}

function clearSelection(){
  selectedIds.clear();
  renderList();
  updateBulkBar();
}

function updateBulkBar(){
  const bar = document.getElementById('bulk-bar');
  const num = document.getElementById('bulk-num');
  num.textContent = selectedIds.size;
  bar.classList.toggle('show', selectedIds.size > 0);
}

function printSelected(){
  const count = selectedIds.size;
  if(count === 0) return;
  toast('جارِ طباعة ' + count + ' إيصال');
  clearSelection();
  toggleSelectMode();
}

renderList();
</script>

</body>
</html>
