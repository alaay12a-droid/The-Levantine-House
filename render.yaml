services:
  - type: web
    name: mandi-menu-1
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install -g pnpm@9 && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: PRIVATE_OBJECT_DIR
        value: skip
      - key: PUBLIC_OBJECT_SEARCH_PATHS
        value: skip
