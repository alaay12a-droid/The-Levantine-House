services:
  - type: web
    name: mandi-menu-1
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: LOG_LEVEL
        value: info
      - key: PRIVATE_OBJECT_DIR
        value: skip
      - key: PUBLIC_OBJECT_SEARCH_PATHS
        value: skip
      - key: DATABASE_URL
        sync: false
      - key: DASHBOARD_JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: DEFAULT_OBJECT_STORAGE_BUCKET_ID
        sync: false

  - type: web
    name: mandi-dashboard
    runtime: static
    region: oregon
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @workspace/dashboard run build
    staticPublishPath: ./artifacts/dashboard/dist/public
    envVars:
      - key: VITE_API_BASE_URL
        value: https://rawabi-mandi-7.onrender.com
      - key: BASE_PATH
        value: /
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
