<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>البيت الشامي - لوحة الإدارة</title>
<style>
body { font-family: Arial; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #0F0A05; color: white; padding: 20px; box-sizing: border-box; }
#qr { margin: 24px; border: 8px solid white; border-radius: 12px; display: block; }
h2 { color: #E8920C; font-size: 22px; margin-bottom: 4px; }
.sub { color: #aaa; font-size: 13px; margin-bottom: 0; direction: rtl; text-align: center; }
.url { background: #1a1a1a; border: 1px solid #444; border-radius: 8px; padding: 10px 16px; font-size: 11px; word-break: break-all; margin-top: 16px; color: #E8920C; max-width: 320px; text-align: center; direction: ltr; }
.step { direction: rtl; text-align: right; max-width: 320px; margin-top: 20px; background: #1a1a1a; border-radius: 10px; padding: 14px 16px; font-size: 13px; line-height: 2; }
.step b { color: #E8920C; }
</style>
</head>
<body>
<h2>البيت الشامي</h2>
<p class="sub">امسح لفتح لوحة الإدارة</p>
<div id="qr"></div>
<div class="step">
  <b>الطريقة 1:</b> افتح كاميرا الهاتف وامسح الكود أعلاه<br>
  <b>الطريقة 2:</b> افتح الرابط في المتصفح
</div>
<div class="url">https://the-levantine-house.onrender.com/dashboard</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
new QRCode(document.getElementById("qr"), {
  text: "https://the-levantine-house.onrender.com/dashboard",
  width: 260,
  height: 260,
  colorDark: "#000000",
  colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.M
});
</script>
</body>
</html>
