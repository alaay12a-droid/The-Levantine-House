kind = "mobile"
previewPath = "/jvn-pos-printer/"
title = "جڤن — طابعة الطلبات"
description = "تطبيق Android مستقل لجهاز Sunmi V3 لإدخال الطلبات يدويًا وطباعة فواتير منسقة عبر الطابعة الحرارية المدمجة، دون قاعدة بيانات أو اتصال خارجي."
version = "1.0.0"
id = "artifacts/jvn-pos-printer"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/jvn-pos-printer/" ]
localPort = 19942

[services.development]
run = "pnpm --filter @workspace/jvn-pos-printer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jvn-pos-printer", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/jvn-pos-printer", "run", "serve" ]

[services.env]
PORT = "19942"
BASE_PATH = "/jvn-pos-printer/"
