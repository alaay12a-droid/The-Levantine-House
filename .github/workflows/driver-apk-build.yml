name: The Levantine House Driver Android APK

on:
  workflow_dispatch:

jobs:
  build-driver:
    name: Build The Levantine House Driver APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Link Driver Expo Project
        working-directory: artifacts/rawabi-driver
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --account 021837ala --non-interactive

      - name: Build Driver Android APK
        working-directory: artifacts/rawabi-driver
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --no-wait

      - name: Print build URL
        run: |
          echo "======================================"
          echo "Driver APK build started on Expo servers."
          echo "Track your build at:"
          echo "https://expo.dev/accounts/021837ala/projects/the-levantine-house-driver/builds"
          echo "======================================"