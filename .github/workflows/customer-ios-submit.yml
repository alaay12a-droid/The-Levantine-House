name: The Levantine House Customer iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-customer-ios:
    name: Build The Levantine House Customer iOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Validate Customer EAS project path
        working-directory: artifacts/rawabi-menu
        run: |
          test "$PWD" = "$GITHUB_WORKSPACE/artifacts/rawabi-menu"
          test -f eas.json
          node -e 'const eas=require("./eas.json"); const app=require("./app.json").expo; if (eas.build?.production?.ios?.image !== "latest" || eas.submit?.production?.ios?.ascAppId !== "6804418785" || app.owner !== "021837ala" || app.extra?.eas?.projectId !== "83b4e404-a637-4f64-b77c-0c397246e99e" || app.ios?.bundleIdentifier !== "com.thelevantinehouse.menu") process.exit(1)'

      - name: Build Customer iOS IPA
        working-directory: artifacts/rawabi-menu
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set +e
          output=$(EAS_PROJECT_ROOT="$GITHUB_WORKSPACE/artifacts/rawabi-menu" TMPDIR=/tmp EAS_NO_VCS=1 EAS_BUILD_NO_EXPO_GO_WARNING=true eas build --platform ios --profile production --non-interactive --no-wait 2>&1)
          exit_code=$?
          printf '%s\n' "$output"
          if [ "$exit_code" -ne 0 ]; then
            diagnostic=$(printf '%s' "$output" | tr '\n' ' ' | cut -c1-5000)
            echo "::error title=EAS iOS IPA build failed::$diagnostic"
            exit "$exit_code"
          fi

      - name: Print build details
        run: |
          echo "======================================"
          echo "Customer iOS build started on Expo servers."
          echo "EAS config: artifacts/rawabi-menu/eas.json"
          echo "Profile: production"
          echo "App Store Connect app ID: 6804418785"
          echo "Bundle ID: com.thelevantinehouse.menu"
          echo "======================================"
